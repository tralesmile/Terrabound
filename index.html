<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1026" />
    <meta name="description" content="Terrabound: dig deep, build drones, survive the Hollow. A free 2D sci-fi digging roguelite." />
    <title>Terrabound - Dig. Automate. Survive.</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b1026'/%3E%3Crect x='3' y='4' width='10' height='9' fill='%23e8a33d'/%3E%3Crect x='5' y='2' width='6' height='5' fill='%2336e0e8'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1026; overflow: hidden; overscroll-behavior: none; }
      canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; image-rendering: pixelated; outline: none; }
      #fatal { display: none; position: fixed; inset: 0; background: #0b1026; color: #fff; font: 16px/1.5 ui-monospace, Menlo, Consolas, monospace; padding: 24px; align-items: center; justify-content: center; text-align: center; }
      noscript { color: #fff; font: 16px sans-serif; padding: 24px; display: block; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0" aria-label="Terrabound game"></canvas>
    <div id="fatal">
      <div>
        <h2>Terrabound hit a problem</h2>
        <p>Your progress is saved. Please reload the page.</p>
        <p><button onclick="location.reload()" style="font:inherit;padding:8px 16px">Reload</button></p>
      </div>
    </div>
    <noscript>Terrabound needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
